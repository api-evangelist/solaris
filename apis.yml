aid: solaris
name: Solaris
description: >-
  Solaris SE is a Berlin-based embedded-finance / Banking-as-a-Service platform
  operating on a full German CRR commercial banking license. Its REST API lets
  partners embed regulated banking into their own products: digital banking with
  local German IBANs and SEPA credit transfers, direct debit and instant
  payments; debit and credit cards with 3D Secure, tokenization and spending
  controls; KYC/KYB identity verification (Bankident, VideoIdent, AutoIdent,
  Fourthline); and lending products including overdrafts, Splitpay and consumer
  and business loans. The API uses OAuth2 client-credentials bearer tokens,
  HMAC-SHA256-signed webhooks for ~80 real-time events, page-number pagination,
  and a structured Money object, and is certified under ISO/IEC 27001,
  PCI DSS 4.0, DORA and GDPR.
