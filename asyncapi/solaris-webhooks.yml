generated: '2026-07-21'
method: searched
source: https://docs.solarisgroup.com/api-reference/webhooks
spec_type: Webhooks
docs: https://docs.solarisgroup.com/api-reference/webhooks
note: >-
  Solaris documents a webhook event surface but publishes no AsyncAPI document.
  This artifact captures the webhook catalog (type: Webhooks). Solaris delivers
  events as HTTPS POST callbacks; there is no streaming/AsyncAPI transport.
transport:
  mechanism: https-post-callback
  subscription_endpoint: POST /v1/webhooks
  subscribe_per_event_type: true
  base_url: https://api.solarisbank.de
delivery:
  expected_response_within_seconds: 30
  response_codes:
    2xx: delivered
    410: subscription cancelled automatically
    422: rejected, not retried
    other: enters retry loop
  retries:
    max_attempts: 25
    backoff_rate: 1.561
    total_duration: ~5 days
    note: >-
      The api-reference/webhooks page states max 25 attempts over ~5 days;
      the guides/get-started/technical-setup page states 20 retries over 7 days.
      Values recorded as published; api-reference treated as authoritative.
security:
  signature_header: Solaris-Webhook-Signature
  algorithm: HMAC-SHA256
  signature_prefix: 'sha256='
  secret: Returned once at subscription creation; used as the HMAC key over the raw body.
  replay_protection_header: Solaris-Webhook-Callout-Timestamp
headers:
  - Content-Type
  - Solaris-Webhook-Id            # unique notification id (idempotency/dedup)
  - Solaris-Webhook-Subscription-Id
  - Solaris-Webhook-Event-Type
  - Solaris-Entity-Id
  - Solaris-Webhook-Attempt
  - Solaris-Webhook-Signature
  - Solaris-Webhook-Callout-Timestamp
  - User-Agent
